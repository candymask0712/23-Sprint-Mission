<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="auth.css">
  <title>회원가입</title>
</head>
<body>
  <div class="auth-page">
    <header class="auth-header">
      <a href="index.html"><img src="images/logo.png"></a>
    </header>
    <form class="auth-form">
      <div class="id">
        <label for="id">이메일</label>
        <input required id="id" type="email" name="id" placeholder="example@email.com">
      </div>
      <div class="name">
        <label for="name">닉네임</label>
        <input required id="name" type="text" name="name" placeholder="닉네임">
      </div>
      <div class="password">
        <label for="password">비밀번호</label>
        <div class="password-input">
          <input required id="password" type="password" name="password" placeholder="비밀번호">
          <img src="images/btn_visibility_on.svg">
        </div>
      </div>   
      <div class="password">
        <label>비밀번호 확인</label>
        <div class="password-input">
          <input required type="password" placeholder="비밀번호 확인">
          <img src="images/btn_visibility_on.svg">
        </div>
      </div>
      <button>회원가입</button>
      <div class="easy-login">
        <p class="easy-login-txt">간편 로그인하기</p>
        <div class="easy-login-img">
          <a href="https://www.google.com/" target="_blank"><img src="images/ic_google.svg"></a>
          <a href="https://www.kakaocorp.com/page/" target="_blank"><img src="images/ic_kakaotalk.svg"></a>
        </div>
      </div>
      <div class="auth-footer">
        <p>이미 회원이신가요?<a href="login.html">로그인</a></p>
      </div>
    </form>
    
  </div>
</body>
</html>
