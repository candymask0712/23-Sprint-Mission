<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/style.css" type="text/css" rel="stylesheet">
        <title>판다마켓</title>
    </head>
    <body>
        <header class="main-header">
            <div class="header-top">
                <a class="header-logo" href="/">
                    <img src="images/logo.png" alt="logo">
                </a>
                <a class="login-button" href="/login.html">로그인</a>
            </div>
        </header>
        <main>
            <div class="banner-top">
                <div class="banner-top-contents">
                    <div class="banner-top-notice">
                        일상의 모든 물건을<br>
                        거래해 보세요
                        <a class="banner-top-btn" href="/items.html">구경하러 가기</a>
                    </div>
                    <img src="images/main_images/Img_home_top.png">
                </div>
            </div>

            <div class="contents"> 
                <section class="content">
                    <img src="images/main_images/Img_home_01.png">
                    <div class="detail">
                        <div class="detail-title">Hot item</div>
                        인기 상품을<br>
                        확인해 보세요
                        <span class="detail-content">가장 HOT한 중고거래 물품을<br>
                        판다 마켓에서 확인해 보세요</span>
                    </div>
                </section>
                <section class="content">
                    <div class="detail detail-second">
                        <div class="detail-title">Search</div>
                        구매를 원하는<br>
                        상품을 검색하세요
                        <span class="detail-content">구매하고 싶은 물품은 검색해서<br>
                        쉽게 찾아보세요</span>
                    </div>
                    <img src="images/main_images/Img_home_02.png">
                </section>
                <section class="content">
                    <img src="images/main_images/Img_home_03.png">
                    <div class="detail">
                        <div class="detail-title">Register</div>
                        판매를 원하는<br>
                        상품을 등록하세요
                        <span class="detail-content">어떤 물건이든 판매하고 싶은 상품을<br>
                        쉽게 등록하세요</span>
                    </div>
                </section>
            </div>
            
            <div class="banner-bottom">
                <div class="banner-bottom-contents">
                    <div class="banner-bottom-notice">
                        믿을 수 있는<br>
                        판다마켓 중고 거래
                    </div>
                    <img src="images/main_images/Img_home_bottom.png">
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="footer-contents">
                <div class="copy">
                    &copy;codeit - 2024
                </div>
                <ul class="footer-menu">
                    <li>
                        <a href="/privacy.html">
                            Privacy Policy
                        </a>
                    </li>
                    <li>
                        <a href="/faq.html">
                            FAQ
                        </a>
                    </li>
                </ul>
                <ul class="sns">
                    <li>
                        <a href="https://www.facebook.com/">
                            <img src="images/main_images/ic_facebook.svg" target="_blank" alt="facebook">
                        </a>
                    </li>
                    <li>
                        <a href="https://x.com/">
                            <img src="images/main_images/ic_twitter.svg" target="_blank" alt="twitter">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com/">
                            <img src="images/main_images/ic_youtube.svg" target="_blank" alt="youtube">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/">
                            <img src="images/main_images/ic_instagram.svg" target="_blank" alt="instagram">
                        </a>
                    </li>
                </ul>
            </div>
        </footer>
    </body>
</html>
